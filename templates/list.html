
{% extends "base.html" %}
{% block contents %}
<a href="{{ url_for('new_memo') }}" class="button">新規作成</a>
<section>
    <p>編集したいメモを選んでください:</p>
    <ul class="memo-list">
        {% for it in items %}
        <li>
            <a href="{{ url_for('memo', id=it.id) }}">
                ✎{{ it.title }}
            </a>
        </li>
        {% endfor %}
    </ul>
</section>
{% endblock %}
